name: Release
# Publishes @vdm-design-team/caf to GitHub Packages when a GitHub release is published.
# The release tag must match package.json ("v" + version).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@vdm-design-team'
      - run: npm ci
      - name: Tag matches package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${GITHUB_REF_NAME}" ] || (echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version $v" && exit 1)
      - name: Install the browser the story tests run in
        run: npx playwright install --with-deps chromium
      # npm test builds the package (tokens, CSS, the component modules and
      # their types) and checks what it would ship (check:package).
      - run: npm test
      # prepack runs `npm run build` again, so the tarball holds a fresh dist/:
      # the tokens and CSS, dist/index.js, dist/components/, dist/lib/ and
      # dist/types/.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
